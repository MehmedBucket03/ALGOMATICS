<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Interactive Vector Visualizer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }
        .canvas-container {
            flex: 2;
            min-width: 600px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .controls-container {
            flex: 1;
            min-width: 300px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h2 {
            color: #333;
            margin-top: 0;
        }
        .instructions {
            color: #666;
            margin-bottom: 20px;
        }
        .input-group {
            margin: 15px 0;
        }
        label {
            display: block;
            margin: 5px 0;
            color: #444;
        }
        input[type="number"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        #info {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 4px;
            line-height: 1.6;
        }
        #vectorCanvas {
            display: block;
            margin: 0 auto;
        }
        button {
            padding: 10px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 10px 0;
        }
        button:hover {
            background: #0056b3;
        }
        @media (max-width: 900px) {
            .container {
                flex-direction: column;
            }
            .canvas-container, .controls-container {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>
<h2>📐 Interactive Vector Visualizer</h2>
<div class="container">
    <div class="canvas-container">
        <p class="instructions">Scroll to zoom • Click and drag to pan</p>
        <canvas id="vectorCanvas" width="600" height="600"></canvas>
    </div>
    <div class="controls-container">
        <div class="input-group">
            <label>Vector A Components:</label>
            <label>X: <input type="number" id="xInput" value="5"></label>
            <label>Y: <input type="number" id="yInput" value="-3"></label>
        </div>
        <div class="input-group">
            <label>Vector B Components (Dot Product Mode):</label>
            <label>X: <input type="number" id="xInputB" value="3"></label>
            <label>Y: <input type="number" id="yInputB" value="4"></label>
        </div>
        <button id="toggleBtn">Switch to Dot Product Animation</button>
        <button id="toggleProjectionBtn">Toggle Projection Animation</button>
        <div id="info"></div>
    </div>
</div>

<script>
    const canvas = document.getElementById("vectorCanvas");
    const ctx = canvas.getContext("2d");

    let zoom = 40;
    const minZoom = 10;
    const maxZoom = 100;
    const origin = { x: canvas.width / 2, y: canvas.height / 2 };

    let targetVectorA = { x: 5, y: -3 };
    let targetVectorB = { x: 3, y: 4 };
    const animatedVectorA = { x: 0, y: 0 };
    const animatedVectorB = { x: 0, y: 0 };

    const xInput = document.getElementById("xInput");
    const yInput = document.getElementById("yInput");
    const xInputB = document.getElementById("xInputB");
    const yInputB = document.getElementById("yInputB");
    const info = document.getElementById("info");

    let isDragging = false;
    let lastMouse = { x: 0, y: 0 };
    let isDotProductMode = false;
    let projectionProgress = 0;
    let animateProjection = true;

    // Debouncing for input updates
    let updateTimeout;
    const debounceDelay = 100; // milliseconds

    canvas.addEventListener("mousedown", (e) => {
        isDragging = true;
        lastMouse.x = e.offsetX;
        lastMouse.y = e.offsetY;
        canvas.style.cursor = 'grabbing';
    });

    canvas.addEventListener("mouseup", () => {
        isDragging = false;
        canvas.style.cursor = 'grab';
    });

    canvas.addEventListener("mousemove", (e) => {
        if (isDragging) {
            const dx = e.offsetX - lastMouse.x;
            const dy = e.offsetY - lastMouse.y;
            origin.x += dx;
            origin.y += dy;
            lastMouse.x = e.offsetX;
            lastMouse.y = e.offsetY;
        }
    });

    canvas.addEventListener("wheel", (e) => {
        e.preventDefault();
        const zoomAmount = e.deltaY > 0 ? -5 : 5;
        zoom = Math.min(maxZoom, Math.max(minZoom, zoom + zoomAmount));
    });

    function toCanvasX(x) {
        return origin.x + x * zoom;
    }

    function toCanvasY(y) {
        return origin.y - y * zoom;
    }

    function drawGrid() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.lineWidth = 1;

        const step = zoom;
        const left = -origin.x / zoom;
        const right = (canvas.width - origin.x) / zoom;
        const bottom = -(canvas.height - origin.y) / zoom;
        const top = origin.y / zoom;

        ctx.strokeStyle = '#eee';
        ctx.fillStyle = '#666';
        ctx.font = "12px sans-serif";
        ctx.textAlign = "center";

        for (let x = Math.floor(left); x <= right; x++) {
            const cx = toCanvasX(x);
            ctx.beginPath();
            ctx.moveTo(cx, 0);
            ctx.lineTo(cx, canvas.height);
            ctx.stroke();
            if (x !== 0) {
                ctx.fillText(x, cx, origin.y + 12);
            }
        }

        ctx.textAlign = "right";
        for (let y = Math.floor(bottom); y <= top; y++) {
            const cy = toCanvasY(y);
            ctx.beginPath();
            ctx.moveTo(0, cy);
            ctx.lineTo(canvas.width, cy);
            ctx.stroke();
            if (y !== 0) {
                ctx.fillText(y, origin.x - 4, cy + 4);
            }
        }

        ctx.strokeStyle = '#aaa';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, origin.y);
        ctx.lineTo(canvas.width, origin.y);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(origin.x, 0);
        ctx.lineTo(origin.x, canvas.height);
        ctx.stroke();
    }

    function drawArrow(fromX, fromY, toX, toY, color = "blue", label = "") {
        const headLength = 10;
        const dx = toX - fromX;
        const dy = toY - fromY;
        const angle = Math.atan2(dy, dx);

        ctx.beginPath();
        ctx.moveTo(fromX, fromY);
        ctx.lineTo(toX, toY);
        ctx.lineTo(
            toX - headLength * Math.cos(angle - Math.PI / 6),
            toY - headLength * Math.sin(angle - Math.PI / 6)
        );
        ctx.moveTo(toX, toY);
        ctx.lineTo(
            toX - headLength * Math.cos(angle + Math.PI / 6),
            toY - headLength * Math.sin(angle + Math.PI / 6)
        );
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.stroke();

        // Add label near the tip
        ctx.fillStyle = color;
        ctx.font = "14px sans-serif";
        ctx.fillText(label, toX + 20, toY - 10);
    }

    function drawDotProduct() {
        // Smoothly animate both vectors
        animatedVectorA.x += (targetVectorA.x - animatedVectorA.x) * 0.2;
        animatedVectorA.y += (targetVectorA.y - animatedVectorA.y) * 0.2;
        animatedVectorB.x += (targetVectorB.x - animatedVectorB.x) * 0.2;
        animatedVectorB.y += (targetVectorB.y - animatedVectorB.y) * 0.2;

        const toAX = toCanvasX(animatedVectorA.x);
        const toAY = toCanvasY(animatedVectorA.y);
        const toBX = toCanvasX(animatedVectorB.x);
        const toBY = toCanvasY(animatedVectorB.y);

        drawArrow(origin.x, origin.y, toAX, toAY, "blue", "A");
        drawArrow(origin.x, origin.y, toBX, toBY, "red", "B");

        // Use target vectors for projection calculations to avoid animation discrepancies
        const dotProduct = targetVectorA.x * targetVectorB.x + targetVectorA.y * targetVectorB.y;
        const magnitudeA = Math.hypot(targetVectorA.x, targetVectorA.y);
        const magnitudeB = Math.hypot(targetVectorB.x, targetVectorB.y);
        const cosTheta = dotProduct / (magnitudeA * magnitudeB);

        if (animateProjection) {
            projectionProgress += 0.05;
            if (projectionProgress > 1) projectionProgress = 1;
        }

        // Calculate the unit vector of B using targetVectorB
        const unitB = { x: targetVectorB.x / magnitudeB, y: targetVectorB.y / magnitudeB };
        const scalarProjection = dotProduct / magnitudeB;

        // Calculate the final projection point (not animated)
        const finalProjectionPoint = {
            x: unitB.x * scalarProjection,
            y: unitB.y * scalarProjection
        };

        // Calculate the animated projection point (for the solid green arrow)
        const animatedProjectionPoint = {
            x: finalProjectionPoint.x * projectionProgress,
            y: finalProjectionPoint.y * projectionProgress
        };

        // Draw projection vector from origin (animated)
        drawArrow(origin.x, origin.y, toCanvasX(animatedProjectionPoint.x), toCanvasY(animatedProjectionPoint.y), "green", "Proj A onto B");

        // Draw perpendicular line from tip of A to the FINAL projection point
        ctx.setLineDash([5, 5]);
        ctx.strokeStyle = "green";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(toAX, toAY); // tip of vector A
        ctx.lineTo(toCanvasX(finalProjectionPoint.x), toCanvasY(finalProjectionPoint.y)); // final projection point on B
        ctx.stroke();
        ctx.setLineDash([]); // Reset dash for future drawings

        info.innerHTML = `
        <b>Vector A:</b> (${targetVectorA.x}, ${targetVectorA.y})<br>
        <b>Vector B:</b> (${targetVectorB.x}, ${targetVectorB.y})<br>
        <b>Dot Product:</b> ${dotProduct.toFixed(2)}<br>
        <b>Magnitude A:</b> ${magnitudeA.toFixed(2)}<br>
        <b>Magnitude B:</b> ${magnitudeB.toFixed(2)}<br>
        <b>Angle between A and B:</b> ${(Math.acos(cosTheta) * 180 / Math.PI).toFixed(2)}°
    `;
    }    function animate() {
        drawGrid();

        if (isDotProductMode) {
            drawDotProduct();
        } else {
            // Smoother animation for single vector mode
            animatedVectorA.x += (targetVectorA.x - animatedVectorA.x) * 0.2; // Increased from 0.1 to 0.2
            animatedVectorA.y += (targetVectorA.y - animatedVectorA.y) * 0.2;

            const toX = toCanvasX(animatedVectorA.x);
            const toY = toCanvasY(animatedVectorA.y);

            drawArrow(origin.x, origin.y, toX, toY, "blue", "A");

            const mag = Math.sqrt(targetVectorA.x ** 2 + targetVectorA.y ** 2);
            const angle = Math.atan2(targetVectorA.y, targetVectorA.x) * 180 / Math.PI;

            info.innerHTML = `
                <b>Vector:</b> (${targetVectorA.x}, ${targetVectorA.y})<br>
                <b>Magnitude:</b> √(${targetVectorA.x}² + ${targetVectorA.y}²) = ${mag.toFixed(2)}<br>
                <b>Direction:</b> atan2(${targetVectorA.y}, ${targetVectorA.x}) ≈ ${angle.toFixed(1)}° from X-axis
            `;
        }

        requestAnimationFrame(animate);
    }

    function updateVectorA() {
        clearTimeout(updateTimeout);
        updateTimeout = setTimeout(() => {
            targetVectorA.x = parseFloat(xInput.value) || 0;
            targetVectorA.y = parseFloat(yInput.value) || 0;
            projectionProgress = 0; // Reset projection animation
        }, debounceDelay);
    }

    function updateVectorB() {
        clearTimeout(updateTimeout);
        updateTimeout = setTimeout(() => {
            targetVectorB.x = parseFloat(xInputB.value) || 0;
            targetVectorB.y = parseFloat(yInputB.value) || 0;
            projectionProgress = 0; // Reset projection animation
        }, debounceDelay);
    }

    document.getElementById("toggleBtn").addEventListener("click", () => {
        isDotProductMode = !isDotProductMode;
        document.getElementById("toggleBtn").innerText = isDotProductMode ? "Switch to Vector Animation" : "Switch to Dot Product Animation";
        projectionProgress = 0;
    });

    document.getElementById("toggleProjectionBtn").addEventListener("click", () => {
        animateProjection = !animateProjection;
        document.getElementById("toggleProjectionBtn").innerText = animateProjection ? "Stop Projection Animation" : "Start Projection Animation";
        if (animateProjection) {
            projectionProgress = 0;
        }
    });

    xInput.addEventListener("input", updateVectorA);
    yInput.addEventListener("input", updateVectorA);
    xInputB.addEventListener("input", updateVectorB);
    yInputB.addEventListener("input", updateVectorB);

    updateVectorA();
    updateVectorB();
    animate();
</script>
</body>
</html>
