<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DFS Visualization</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            background-color: #eef2f7;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #2c3e50;
            font-size: 28px;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 40px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        canvas {
            background: white;
            border: 3px solid #2c3e50;
            border-radius: 10px;
            box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.2);
        }

        .table-container, .stack-container {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.15);
            width: 220px;
            text-align: center;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            background: white;
            border-radius: 5px;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background: #3498db;
            color: white;
        }

        .stack-box {
            background-color: #ff7675;
            border-radius: 5px;
            padding: 10px;
            margin: 5px 0;
            font-weight: bold;
            color: white;
        }

        .legend-container {
            background: white;
            display: inline-block;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
        }

        .legend-container p {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        .color-box {
            display: inline-block;
            width: 20px;
            height: 20px;
            border-radius: 5px;
            border: 1px solid black;
        }

        .button-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 18px;
            font-size: 16px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s ease-in-out;
            box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            background: #2980b9;
        }

        #pauseDFS {
            background: #e74c3c;
        }

        #pauseDFS:hover {
            background: #c0392b;
        }

        #stepDescription {
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
            margin-top: 10px;
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>

<h1>DFS Graph Traversal Visualization</h1>

<div class="legend-container">
    <h3>Legend</h3>
    <p><span class="color-box" style="background: white;"></span> Unvisited Node</p>
    <p><span class="color-box" style="background: orange;"></span> Currently Visiting</p>
    <p><span class="color-box" style="background: #ffea00;"></span> Visiting Node</p>
    <p><span class="color-box" style="background: blue;"></span> Visited Node</p>
    <p><span class="color-box" style="background: black; width: 30px; height: 5px;"></span> Unexplored Edge</p>
    <p><span class="color-box" style="background: #f62626; width: 30px; height: 5px;"></span> Currently Exploring Edge</p>
    <p><span class="color-box" style="background: #b6aaaa; width: 30px; height: 5px;"></span>  Explored Edge</p>
</div>


<div id="stepDescription"></div>

<div class="container">
    <canvas id="canvas" width="600" height="400"></canvas>

    <div class="table-container">
        <table id="visitedTable">
            <tr><th>Visited Nodes</th></tr>
        </table>
        <br>
        <table id="stackTable">
            <tr><th>Stack (Next to Visit)</th></tr>
        </table>
    </div>

</div>

<div class="button-container">
    <button id="startDFS">Start DFS</button>
    <button id="pauseDFS">Pause</button>
    <button id="prevStep">Rewind</button>
    <button id="nextStep">Next Step</button>
</div>

<script>
    let canvas = document.getElementById("canvas");
    let ctx = canvas.getContext("2d");

    let isPaused = false;
    let traversalSteps = [];
    let currentStep = 0;
    let isRunning = false;

    let graph = {
        1: [2, 3],
        2: [4, 5],
        3: [6],
        4: [],
        5: [],
        6: []
    };

    let positions = {
        1: {x: 300, y: 100},
        2: {x: 200, y: 200},
        3: {x: 400, y: 200},
        4: {x: 150, y: 300},
        5: {x: 250, y: 300},
        6: {x: 450, y: 300}
    };

    function delay(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    function drawGraph(activeNode = null, visitedNodes = new Set(), discoveredNodes = new Set(), lastEdge = null) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (let node in graph) {
            graph[node].forEach(neighbor => {
                let color = "black"; // Default unvisited edge
                if (visitedNodes.has(parseInt(neighbor))) {
                    color = "gray"; // Edge to a visited node
                }
                if (lastEdge && lastEdge[0] == node && lastEdge[1] == neighbor) {
                    color = "red"; // Currently traversed edge
                }
                drawArrow(node, neighbor, color);
            });
        }

        for (let node in positions) {
            ctx.beginPath();
            ctx.arc(positions[node].x, positions[node].y, 25, 0, 2 * Math.PI);

            if (activeNode == node) {
                ctx.fillStyle = "orange"; // Active node
            } else if (visitedNodes.has(parseInt(node))) {
                ctx.fillStyle = "blue"; // Fully visited nodes
            } else if (discoveredNodes.has(parseInt(node))) {
                ctx.fillStyle = "yellow"; // Discovered but not fully visited
            } else {
                ctx.fillStyle = "white"; // Unvisited nodes
            }

            ctx.fill();
            ctx.stroke();
            ctx.fillStyle = "black";
            ctx.fillText(node, positions[node].x - 5, positions[node].y + 5);
        }
    }

    function drawArrow(from, to, color = "black") {
        ctx.beginPath();
        ctx.moveTo(positions[from].x, positions[from].y);
        ctx.lineTo(positions[to].x, positions[to].y);
        ctx.strokeStyle = color;
        ctx.lineWidth = 4;
        ctx.stroke();

        drawDirectionalArrow(from, to, color);
    }

    function drawDirectionalArrow(from, to, color) {
        let { x: x1, y: y1 } = positions[from];
        let { x: x2, y: y2 } = positions[to];

        let angle = Math.atan2(y2 - y1, x2 - x1);
        let arrowSize = 10;

        let arrowX = x1 + (x2 - x1) * 0.6;
        let arrowY = y1 + (y2 - y1) * 0.6;

        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(arrowX, arrowY);
        ctx.lineTo(
            arrowX - arrowSize * Math.cos(angle - Math.PI / 6),
            arrowY - arrowSize * Math.sin(angle - Math.PI / 6)
        );
        ctx.lineTo(
            arrowX - arrowSize * Math.cos(angle + Math.PI / 6),
            arrowY - arrowSize * Math.sin(angle + Math.PI / 6)
        );
        ctx.closePath();
        ctx.fill();
    }

    function updateVisualization() {
        if (currentStep >= 0 && currentStep < traversalSteps.length) {
            let { visited, discovered, stack, activeNode, lastEdge } = traversalSteps[currentStep];

            drawGraph(activeNode, new Set(visited), new Set(discovered), lastEdge);
            updateTable(visited, stack);

            let stepDesc = document.getElementById("stepDescription");
            if (activeNode) {
                stepDesc.textContent = `Exploring Node ${activeNode}`;
            } else if (stack.length > 0) {
                stepDesc.textContent = `Backtracking to Node ${stack[stack.length - 1]}`;
            } else {
                stepDesc.textContent = "DFS Traversal Completed!";
            }
        }
    }

    function updateTable(visited, stack) {
        const visitedTable = document.getElementById("visitedTable");
        visitedTable.innerHTML = `<tr><th>Visited Nodes</th></tr>` +
            visited.map(n => `<tr><td class="visited-node">${n}</td></tr>`).join("");

        const stackTable = document.getElementById("stackTable");
        stackTable.innerHTML = `<tr><th>Stack (Next to Explore)</th></tr>` +
            stack.map(n => `<tr><td>${n}</td></tr>`).reverse().join("");
    }

    async function dfs(node, visited = new Set(), discovered = new Set(), stack = [], lastEdge = null) {
        stack.push(node);
        discovered.add(node);
        traversalSteps.push({ visited: Array.from(visited), discovered: Array.from(discovered), stack: [...stack], activeNode: node, lastEdge: null });

        for (let neighbor of graph[node]) {
            if (!discovered.has(neighbor)) {
                traversalSteps.push({ visited: Array.from(visited), discovered: Array.from(discovered), stack: [...stack], activeNode: node, lastEdge: [node, neighbor] });
                await dfs(neighbor, visited, new Set(discovered), [...stack], [node, neighbor]);
            }
        }

        visited.add(node);
        stack.pop();
        traversalSteps.push({ visited: Array.from(visited), discovered: Array.from(discovered), stack: [...stack], activeNode: null, lastEdge: null });
    }

    async function runAnimation() {
        isRunning = true;
        while (currentStep < traversalSteps.length) {
            if (!isPaused) {
                updateVisualization();
                await delay(800);
                currentStep++;
            } else {
                await delay(100);
            }
        }
        isRunning = false;
    }

    document.getElementById("startDFS").addEventListener("click", async () => {
        traversalSteps = [];
        currentStep = 0;
        isPaused = false;
        isRunning = true;
        await dfs(1);
        runAnimation();
    });

    document.getElementById("pauseDFS").addEventListener("click", () => {
        isPaused = !isPaused;
        let btn = document.getElementById("pauseDFS");
        btn.textContent = isPaused ? "Resume" : "Pause";
        btn.style.background = isPaused ? "green" : "darkblue";
    });

    document.getElementById("prevStep").addEventListener("click", () => {
        if (currentStep > 0) {
            currentStep--;
            updateVisualization();
        }
    });

    document.getElementById("nextStep").addEventListener("click", () => {
        if (currentStep < traversalSteps.length - 1) {
            currentStep++;
            updateVisualization();
        }
    });

    drawGraph();
</script>

</body>
</html>
