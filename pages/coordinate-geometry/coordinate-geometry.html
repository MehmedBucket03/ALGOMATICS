<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Coordinate Geometry</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="coordinate.css">
</head>

<body class="text-center font-['Silkscreen'] text-white" style="background-color: #0a0a23;">
<main class="py-8 px-4">
  <h1 class="text-4xl font-bold mb-8">Coordinate Geometry</h1>

  <section class="mb-10">
    <h2 class="text-2xl mb-4">Select Calculation</h2>
    <div class="space-x-4">
      <button id="midpoint-btn" class="bg-pink-500 text-white px-6 py-3 rounded hover:bg-pink-600">Midpoint</button>
      <button id="slope-btn" class="bg-blue-500 text-white px-6 py-3 rounded hover:bg-blue-600">Slope</button>
      <button id="equation-btn" class="bg-purple-600 text-white px-6 py-3 rounded hover:bg-purple-700">Equation of Line</button>
    </div>
  </section>

  <section class="input-container mb-10">
    <h3 class="text-xl mb-4">Enter Points</h3>
    <label class="block mb-2 text-lg">Point A (x₁, y₁):
      <input type="number" id="x1" class="text-black p-2 rounded w-24 mx-1"> ,
      <input type="number" id="y1" class="text-black p-2 rounded w-24 mx-1">
    </label>
    <label class="block mb-2 text-lg">Point B (x₂, y₂):
      <input type="number" id="x2" class="text-black p-2 rounded w-24 mx-1"> ,
      <input type="number" id="y2" class="text-black p-2 rounded w-24 mx-1">
    </label>
    <button id="graph-btn" class="bg-green-500 text-white px-6 py-3 mt-4 rounded hover:bg-green-600">Graph</button>
  </section>

  <section class="graph-container mb-12">
    <h2 class="text-2xl mb-4">Graph Visualization</h2>
    <div id="desmos-calculator" class="mx-auto rounded border-4 border-[#d4a4ff]" style="height: 700px; width: 100%; max-width: 1000px;"></div>
  </section>

  <section id="breakdown-container" class="breakdown text-left max-w-3xl mx-auto bg-[#1c1c3b] p-6 rounded-lg border-4 border-[#d4a4ff]" style="display: none;">
    <h2 class="text-2xl mb-4 text-center">Calculation Breakdown</h2>

    <div id="midpoint-text" class="mb-6 text-lg leading-relaxed"></div>
    <div id="slope-text" class="mb-6 text-lg leading-relaxed"></div>
    <div id="equation-text" class="mb-6 text-lg leading-relaxed"></div>
  </section>
</main>

<script src="https://www.desmos.com/api/v1.11/calculator.js?apiKey=dcb31709b452b1cf9dc26972add0fda6"></script>
<script src="coordinate.js"></script>
</body>
</html>
