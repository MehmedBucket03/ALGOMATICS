<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Interactive Geometry</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="angles-triangles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>

<body class="text-center font-['Silkscreen'] text-white" style="background-color: #0a0a23;">

<div class="content">
  <header class="py-4">
    <nav class="header-bg text-white py-2 px-6 rounded-full mx-4 flex justify-between items-center">
      <div class="flex space-x-4">
        <a class="text-white nav-link" href="home.html">HOME</a>
        <a class="text-white nav-link" href="about.html">ABOUT</a>
        <a class="text-white nav-link" href="math.html">MATH</a>
        <a class="text-white nav-link" href="../algorithms/algorithms.html">ALGORITHMS</a>
      </div>
      <a class="bg-[#6d149f] text-white px-4 py-2 rounded-full hover:bg-[#75107d]" href="login.html">LOGIN / SIGN UP</a>
    </nav>
  </header>

  <main class="py-8">
    <h1 class="text-3xl font-bold mb-6">Interactive Geometry</h1>

    <div class="menu mb-4">
      <button onclick="showSection('angles')" class="border-4 border-[#d4a4ff] text-[#d4a4ff] px-4 py-2 m-2 hover:bg-[#d4a4ff] hover:text-[#0a0a23]">Angles</button>
      <button onclick="showSection('triangles')" class="border-4 border-[#d4a4ff] text-[#d4a4ff] px-4 py-2 m-2 hover:bg-[#d4a4ff] hover:text-[#0a0a23]">Triangles</button>
      <button onclick="showSection('congruence')" class="border-4 border-[#d4a4ff] text-[#d4a4ff] px-4 py-2 m-2 hover:bg-[#d4a4ff] hover:text-[#0a0a23]">Congruence Theorem</button>
    </div>

    <div id="triangleOptions" style="display: none;" class="mb-6">
      <button onclick="showEquilateral()" class="border-2 border-[#d4a4ff] px-3 py-1 m-1 hover:bg-[#d4a4ff] hover:text-[#0a0a23]">Equilateral</button>
      <button onclick="showIsosceles()" class="border-2 border-[#d4a4ff] px-3 py-1 m-1 hover:bg-[#d4a4ff] hover:text-[#0a0a23]">Isosceles</button>
      <button onclick="showScalene()" class="border-2 border-[#d4a4ff] px-3 py-1 m-1 hover:bg-[#d4a4ff] hover:text-[#0a0a23]">Scalene</button>
    </div>

    <div id="congruenceButtons" class="mb-6"></div>

    <div class="explanation text-lg mb-6">
      <p id="theoremExplanation">Click a menu option to begin.</p>
    </div>

    <div class="canvas-wrapper flex justify-center mb-6">
      <canvas id="geometryCanvas" width="400" height="400" class="border-4 border-[#d4a4ff] bg-[#1c1c3b]"></canvas>
    </div>

    <div class="controls" id="angleControls">
      <label class="block mb-2">Angle: <span id="angleValue">90</span>°</label>
      <input type="range" id="angleSlider" min="0" max="180" value="90" class="w-80">
      <div class="preset-angles mt-4">
        <button onclick="setAngle(30)" class="border-2 border-[#d4a4ff] px-3 py-1 m-1 hover:bg-[#d4a4ff] hover:text-[#0a0a23]">30°</button>
        <button onclick="setAngle(45)" class="border-2 border-[#d4a4ff] px-3 py-1 m-1 hover:bg-[#d4a4ff] hover:text-[#0a0a23]">45°</button>
        <button onclick="setAngle(60)" class="border-2 border-[#d4a4ff] px-3 py-1 m-1 hover:bg-[#d4a4ff] hover:text-[#0a0a23]">60°</button>
        <button onclick="setAngle(90)" class="border-2 border-[#d4a4ff] px-3 py-1 m-1 hover:bg-[#d4a4ff] hover:text-[#0a0a23]">90°</button>
        <button onclick="setAngle(120)" class="border-2 border-[#d4a4ff] px-3 py-1 m-1 hover:bg-[#d4a4ff] hover:text-[#0a0a23]">120°</button>
      </div>
    </div>
  </main>

  <section class="footer-bg text-white py-4 mt-10">
    <div class="bg-blue-300 p-4 mt-4 mx-8 rounded-lg flex justify-center items-center space-x-4">
      <div class="bg-purple-500 w-16 h-16"></div>
      <div class="bg-blue-500 w-16 h-16"></div>
      <div class="bg-blue-900 w-16 h-16"></div>
    </div>
    <footer class="mt-4">
      <div class="flex justify-between px-8">
        <div class="text-left">
          <a class="block text-white nav-link" href="home.html">Home</a>
          <a class="block text-white nav-link" href="about.html">About</a>
          <a class="block text-white nav-link" href="math.html">Math</a>
          <a class="block text-white nav-link" href="../algorithms/algorithms.html">Algorithms</a>
        </div>
        <div class="text-right">
          <a class="block text-white nav-link" href="terms.html">Terms & Conditions</a>
          <p>© 2025 by ALGOMATICS.</p>
        </div>
      </div>
    </footer>
  </section>
</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="angles-triangles.js"></script>
</body>
</html>
